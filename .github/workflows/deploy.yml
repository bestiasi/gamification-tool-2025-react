name: Test and deploy to Hostinger

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java for the Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Lint and unit tests
        run: npm run lint && npm test

      - name: Firestore rules tests
        run: npm run test:rules

      - name: End-to-end tests
        run: npx playwright install --with-deps chromium && npm run test:e2e

      - name: Build project
        run: npm run build

      # Rules ship before the frontend so the site never runs against older rules.
      - name: Check Firebase deploy credentials
        if: github.event_name == 'push'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is required. Add it in repository Settings > Secrets and variables > Actions. Release stopped before publishing the frontend."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules and indexes
        if: github.event_name == 'push'
        run: npx firebase deploy --only firestore:rules,firestore:indexes --project s2ws2w --non-interactive

      - name: FTP Deploy
        if: github.event_name == 'push'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: gamification-tool/
